name: SF64 Mod - Windows build

# Builds the mod for Windows and publishes it as a (pre)release, so the build can be
# downloaded from the Releases page. No game assets are included: the game creates
# sf64.o2r from your own ROM on the first start.

on:
  push:
    branches: [ "sf64-mod" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-port-o2r:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: sudo apt-get install gcc g++ git cmake ninja-build lsb-release
      - name: Generate starship.o2r
        run: |
          make -C tools/Torch type=release -j3
          tools/Torch/cmake-build-release/torch pack port starship.o2r o2r
      - uses: actions/upload-artifact@v4
        with:
          name: starship.o2r
          path: starship.o2r
          retention-days: 1

  build-windows:
    needs: generate-port-o2r
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B "build/x64" -G "Visual Studio 17 2022" -T v143 -A x64 -DCMAKE_BUILD_TYPE=Release *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build ./build/x64 --config Release --parallel 10 *>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Download starship.o2r
        uses: actions/download-artifact@v4
        with:
          name: starship.o2r
          path: ./build/x64/Release
      - name: Create package
        shell: pwsh
        run: |
          mkdir sf64-mod
          Copy-Item build/x64/Release/Starship.exe sf64-mod/
          Copy-Item build/x64/Release/starship.o2r sf64-mod/
          Copy-Item config.yml sf64-mod/
          Copy-Item -Recurse assets sf64-mod/assets
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt" -OutFile "sf64-mod/gamecontrollerdb.txt"
          Compress-Archive -Path sf64-mod/* -DestinationPath SF64Mod-windows.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SF64Mod-windows
          path: sf64-mod
      - name: Publish build to the ci-build branch
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ci-build"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item SF64Mod-windows.zip $out/
          Set-Content -Path (Join-Path $out "BUILD.txt") -Value "commit ${{ github.sha }} run ${{ github.run_number }}"
          cd $out
          git init -q
          git checkout -q -b ci-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows build ${{ github.run_number }} for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-build
      - name: Publish build log on failure
        if: failure()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ci-logs"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path build.log) { Copy-Item build.log $out/ } else { Set-Content -Path (Join-Path $out "build.log") -Value "no build log" }
          cd $out
          git init -q
          git checkout -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build log of run ${{ github.run_number }} for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SF64 Mod build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Windows build of the Star Fox 64 mod (commit ${{ github.sha }}).
            Unzip, start Starship.exe and select your Star Fox 64 (US 1.0/1.1) ROM on the first start.
          files: SF64Mod-windows.zip
